<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#4f46e5" />
    <meta
      name="description"
      content="Artiqal — personalized functional communication practice for adults."
    />
    <link rel="icon" type="image/png" href="/brand/artiqal-logo-v2.png" />
    <link rel="apple-touch-icon" href="/brand/artiqal-logo-v2.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>Artiqal | Functional communication practice</title>
    <script>
      window.addEventListener("error", function (event) {
        if (
          event.error instanceof DOMException &&
          event.error.name === "DataCloneError" &&
          event.message &&
          event.message.includes("PerformanceServerTiming")
        ) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run Artiqal.</noscript>
    <div id="root"></div>
  </body>
</html>
